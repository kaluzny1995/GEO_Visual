[tox]
envlist = lint, py311
minversion = 4.0
# Keep generated virtualenvs outside the project: Streamlit watches the app
# folder recursively, and a local .tox (tens of thousands of files) overflows
# the Linux inotify queue.
work_dir = {env:HOME}/.cache/tox/geo_visual

[testenv]
skip_install = true
deps =
    streamlit>=1.37
    pandas>=2.0
    sqlalchemy>=2.0
    psycopg[binary]>=3.1
    python-dotenv>=1.0
    pydantic>=2.0
    plotly>=5.20
    pytest>=7.0.0
commands =
    pytest {posargs}

[testenv:lint]
skip_install = true
deps =
    ruff>=0.6
commands =
    ruff check --output-format=concise .

[testenv:format]
description = Check formatting (run `tox -e format-fix` to apply)
skip_install = true
deps =
    ruff>=0.6
commands =
    ruff format --check .

[testenv:format-fix]
skip_install = true
deps =
    ruff>=0.6
commands =
    ruff format .

[testenv:typecheck]
skip_install = true
deps =
    mypy>=1.10
    pandas-stubs>=2.0
    streamlit>=1.37
    pandas>=2.0
    sqlalchemy>=2.0
    psycopg[binary]>=3.1
    python-dotenv>=1.0
    pydantic>=2.0
    plotly>=5.20
commands =
    mypy

[testenv:warnings]
description = Run the test suite with Python warnings turned into errors
skip_install = true
deps =
    streamlit>=1.37
    pandas>=2.0
    sqlalchemy>=2.0
    psycopg[binary]>=3.1
    python-dotenv>=1.0
    pydantic>=2.0
    plotly>=5.20
    pytest>=7.0.0
commands =
    pytest -W error::DeprecationWarning {posargs}
